name: CI - build and test

on:
  push:
    branches: ['**']

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest pytest-cov bcrypt jwt

      - name: Run tests
        run: pytest -v

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy to PythonAnywhere
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PA_SSH_HOST }}
          username: ${{ secrets.PA_SSH_USER }}
          key: ${{ secrets.PA_SSH_KEY }}
          script: |
            cd ~/Projekt-zespolowy
            git pull
            touch /var/www/${{ secrets.PA_SSH_USER }}_pythonanywhere_com_wsgi.py
